<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futures Trading Assistant</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
    }
    .splash { text-align: center; }
    .logo { font-size: 3rem; margin-bottom: 12px; }
    .title { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .hint { margin-top: 18px; font-size: 0.85rem; color: #94a3b8; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">📈</div>
    <div class="title">Futures Trading Assistant</div>
    <div class="spinner"></div>
    <div class="hint">Starting the assistant… this can take a moment on first launch.</div>
  </div>
</body>
</html>
