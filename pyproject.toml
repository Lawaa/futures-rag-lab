[project]
name = "futures-rag-lab"
version = "0.1.0"
description = "State-of-the-art Retrieval-Augmented Generation assistant for futures trading."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "google-generativeai>=0.8.6",
    "keyring>=25.7.0",
    "langchain>=0.2.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.2.0",
    "langchain-experimental>=0.0.60",
    "langchain-google-genai>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
futures-rag = "src.cli:run"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["src"]