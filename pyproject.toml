[project]
name = "futures-rag-lab"
version = "0.1.0"
description = "State-of-the-art Retrieval-Augmented Generation assistant for futures trading."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.2",
    "google-generativeai>=0.8.6",
    "keyring>=25.7.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.5.0",
    "langchain-google-genai>=4.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "fastembed>=0.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
futures-rag = "src.cli:run"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["src"]
